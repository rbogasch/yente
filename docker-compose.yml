services:
  index:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      node.name: index
      cluster.name: opensanctions-index
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    volumes:
      - index-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

  app:
    image: yente:local
    build: .
    depends_on:
      index:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./manifests:/app/local-manifests:ro
    environment:
      YENTE_INDEX_TYPE: elasticsearch
      YENTE_INDEX_URL: http://index:9200
      YENTE_MANIFEST: /app/local-manifests/local-sanctions.yml
      YENTE_UPDATE_TOKEN: ${YENTE_UPDATE_TOKEN:-local-only-change-me}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s
    deploy:
      mode: replicated
      # Run multiple instances for better scale:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s

volumes:
  index-data:
